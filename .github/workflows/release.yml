name: Release

# Publishing only ever happens here, for a GitHub release: one published by hand, or one created by the
# "Create release" workflow (which calls this directly, since releases made with GITHUB_TOKEN trigger no workflows).
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com/
          cache: npm

      - name: Tag matches package.json version
        run: |
          TAG_VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $PACKAGE_VERSION. Create releases with the \"Create release\" workflow, which bumps package.json."
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - name: Committed bundles and typings match the source
        run: git diff --exit-code -- es5.js light.js bottleneck.d.ts light.d.ts

      - run: npm run test:local

      - name: Publish
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npm publish --tag next
          else
            npm publish
          fi
