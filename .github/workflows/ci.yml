name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.suite }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        suite: [local, es5, light, redis, cluster, glide, glide-cluster]
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TIMING_TOLERANCE_MS: 250
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Start Redis
        if: matrix.suite != 'local' && matrix.suite != 'es5' && matrix.suite != 'light'
        env:
          SERVICE: ${{ endsWith(matrix.suite, 'cluster') && 'redis-cluster' || 'redis' }}
        # Startup takes seconds; a rare runner hang never recovers in place, so print what the nodes saw and start over once
        run: |
          for attempt in 1 2; do
            docker compose -f docker-compose.test.yml up -d --wait "$SERVICE" && exit 0
            echo "::warning::$SERVICE was not healthy (attempt $attempt)"
            docker compose -f docker-compose.test.yml logs "$SERVICE"
            docker compose -f docker-compose.test.yml exec -T "$SERVICE" sh -c 'tail -n 30 /data/*.log' || true
            docker compose -f docker-compose.test.yml down -v
          done
          exit 1

      - name: Build
        run: |
          if [ "${{ matrix.suite }}" = "es5" ] || [ "${{ matrix.suite }}" = "light" ]; then
            npm run build
          else
            ./scripts/build.sh dev
          fi

      - name: Committed bundles and typings match the source
        if: matrix.suite == 'es5' || matrix.suite == 'light'
        run: git diff --exit-code -- es5.js light.js bottleneck.d.ts light.d.ts

      - name: Test
        # A suite takes under a minute; a connection left open keeps mocha alive, so fail fast instead of at the job timeout
        timeout-minutes: 4
        run: npm run test:${{ matrix.suite }}

      - name: Redis logs
        if: failure() && matrix.suite != 'local' && matrix.suite != 'es5' && matrix.suite != 'light'
        run: docker compose -f docker-compose.test.yml logs

  result:
    name: CI result
    needs: test
    # always(): a skipped required check counts as passing, so this must run and fail when any suite fails
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every suite passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Test matrix finished with: ${{ needs.test.result }}"
            exit 1
          fi
